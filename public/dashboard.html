<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenzi Shop Operations CRM</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    /* Zenzi Brand Colors & Typography */
    :root {
      --bg-main: #f6f4f0;
      --text-dark: #1c1714;
      --text-muted: #6b5c50;
      --col-bg: #3b332c;
      --border-dark: #2d251e;
      --accent: #7a5230;
      --card-bg: #ffffff;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-main);
      margin: 0;
      padding: 32px 24px;
      color: var(--text-dark);
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      border-bottom: 2px solid #e8e4dc;
      padding-bottom: 16px;
    }
    h2 { font-weight: 700; font-size: 24px; letter-spacing: -0.5px; margin: 0; color: var(--text-dark); }
    
    .header-actions { display: flex; gap: 12px; align-items: center; }
    .user-badge { font-size: 13px; font-weight: 500; color: var(--text-muted); }
    
    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary { background: var(--text-dark); color: #fff; }
    .btn-primary:hover { background: var(--accent); }
    .btn-secondary { background: #e8e4dc; color: var(--text-dark); }
    .btn-secondary:hover { background: #d8d2c7; }
    .btn-danger { background: transparent; color: #dc2626; border: 1px solid #dc2626; padding: 6px 12px; }
    .btn-danger:hover { background: #fef2f2; }

    /* Modal Form Overlay */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(28, 23, 20, 0.6);
      backdrop-filter: blur(4px);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    
    .modal-content {
      background: var(--card-bg);
      padding: 32px;
      border-radius: 12px;
      width: 100%; max-width: 650px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      transform: translateY(20px);
      transition: transform 0.2s ease;
    }
    .modal-overlay.active .modal-content { transform: translateY(0); }
    
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .modal-header h3 { margin: 0; font-size: 18px; }
    .close-modal { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted); }

    form {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px;
    }
    input, select {
      padding: 12px 14px;
      border: 1px solid #d8d2c7;
      border-radius: 6px;
      font-size: 14px;
      background: #faf8f5;
      outline: none; width: 100%;
    }
    input:focus, select:focus { border-color: var(--accent); background: #ffffff; }
    .form-full { grid-column: 1 / -1; }

    /* Kanban Pipeline */
    .pipeline {
      display: flex; gap: 20px; overflow-x: auto; padding-bottom: 24px; align-items: flex-start;
    }
    .column-wrapper {
      flex: 1;
      min-width: 280px;
      display: flex;
      flex-direction: column;
    }
    .column-header {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      color: var(--text-dark);
      text-align: center;
      margin-bottom: 12px;
    }
    .column-content {
      background: var(--col-bg);
      border: 3px solid var(--border-dark);
      border-radius: 6px;
      padding: 12px;
      min-height: 600px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    /* Kanban Cards */
    .card {
      background: var(--card-bg);
      padding: 16px;
      border: 2px solid var(--border-dark);
      border-radius: 4px;
      cursor: grab;
      position: relative;
    }
    .card:active { cursor: grabbing; }
    
    .card-top-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .customer-name { font-weight: 700; font-size: 14px; color: var(--text-dark); }
    .btn-delete { background: transparent; border: none; color: #a1a1aa; cursor: pointer; font-size: 11px; text-transform: uppercase; font-weight: 600; padding: 0; }
    .btn-delete:hover { color: #dc2626; }
    
    .card-text { color: var(--text-muted); font-size: 12px; margin-bottom: 4px; line-height: 1.4; }
    .instruction-text { font-style: italic; color: #854d0e; background: #fefce8; padding: 6px 8px; border-radius: 4px; font-size: 11px; margin-top: 8px; border-left: 2px solid #ca8a04; }
    
    /* Elegant Tags */
    .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
    .tag { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .tag-branch { background: #e5e5e5; color: #525252; }
    .tag-ncm { background: #dbeafe; color: #1e40af; }
    .tag-vref { background: #f3ece4; color: var(--accent); }
  </style>
</head>
<body>

  <div class="header">
    <h2>Zenzi Operations</h2>
    <div class="header-actions">
      <span class="user-badge" id="userEmail">Loading...</span>
      <button class="btn btn-primary" onclick="openModal()">+ Add Order</button>
      <button class="btn btn-secondary" onclick="syncNCM()">Sync NCM</button>
      <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>
  </div>

  <!-- Order Entry Modal -->
  <div class="modal-overlay" id="orderModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>New Order Entry</h3>
        <button class="close-modal" onclick="closeModal()">&times;</button>
      </div>
      <form id="orderForm">
        <input type="text" id="name" placeholder="Customer Name *" required>
        <input type="text" id="phone" placeholder="Primary Phone *" required>
        <input type="text" id="phone2" placeholder="Secondary Phone (Optional)">
        <input type="text" id="packageName" placeholder="Package (e.g. Canvas Tote) *" required>
        <input type="number" id="codAmount" placeholder="COD Amount (NPR) *" required>
        <input list="branchList" id="toBranch" placeholder="Destination Branch *" required>
        <datalist id="branchList"></datalist>
        <select id="deliveryType">
          <option value="Door2Door" selected>Door2Door Delivery</option>
          <option value="Branch2Branch">Branch2Branch Pickup</option>
        </select>
        <input type="text" id="address" class="form-full" placeholder="Full Delivery Address *" required>
        <input type="text" id="instruction" class="form-full" placeholder="Instructions / Remarks (Optional)">
        <button type="submit" class="btn btn-primary form-full" style="padding: 14px; margin-top: 8px;">Submit Order</button>
      </form>
    </div>
  </div>

  <!-- Kanban Board -->
  <div class="pipeline">
    <div class="column-wrapper">
      <div class="column-header">Received</div>
      <div class="column-content" id="received" ondragover="allowDrop(event)" ondrop="drop(event, 'received')"></div>
    </div>
    <div class="column-wrapper">
      <div class="column-header">Packed (API)</div>
      <div class="column-content" id="packed" ondragover="allowDrop(event)" ondrop="drop(event, 'packed')"></div>
    </div>
    <div class="column-wrapper">
      <div class="column-header">Processing</div>
      <div class="column-content" id="processing" ondragover="allowDrop(event)" ondrop="drop(event, 'processing')"></div>
    </div>
    <div class="column-wrapper">
      <div class="column-header">Hold Orders</div>
      <div class="column-content" id="hold" ondragover="allowDrop(event)" ondrop="drop(event, 'hold')"></div>
    </div>
    <div class="column-wrapper">
      <div class="column-header">Problematic</div>
      <div class="column-content" id="problem" ondragover="allowDrop(event)" ondrop="drop(event, 'problem')"></div>
    </div>
    <div class="column-wrapper">
      <div class="column-header">Delivered</div>
      <div class="column-content" id="delivered" ondragover="allowDrop(event)" ondrop="drop(event, 'delivered')"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://pnecdxsqaevyvsnibdcu.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBuZWNkeHNxYWV2eXZzbmliZGN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNTM5ODYsImV4cCI6MjEwNDYyOTk4Nn0.Tv4JKePkfyAFUYsDnPSRNnRIt_mcs_lmNFh67VHaEBI";
    const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Modal Controls
    function openModal() { document.getElementById('orderModal').classList.add('active'); }
    function closeModal() { document.getElementById('orderModal').classList.remove('active'); document.getElementById('orderForm').reset(); }

    // Session Verification
    dbClient.auth.getSession().then(({ data: { session } }) => {
      if (!session) window.location.href = '/index.html';
      else document.getElementById('userEmail').innerText = session.user.email;
    }).catch(() => { window.location.href = '/index.html'; });

    async function logout() {
      try { await dbClient.auth.signOut(); } catch (err) {}
      finally {
        for (let key in localStorage) if (key.startsWith('sb-')) localStorage.removeItem(key);
        window.location.href = '/index.html';
      }
    }

    async function loadBranches() {
      try {
        const res = await fetch('/api/branches');
        const branches = await res.json();
        const datalist = document.getElementById('branchList');
        datalist.innerHTML = '';
        branches.forEach(b => {
          const opt = document.createElement('option');
          opt.value = b;
          datalist.appendChild(opt);
        });
      } catch (err) {}
    }

    async function loadOrders() {
      const res = await fetch('/api/orders');
      const orders = await res.json();
      
      document.querySelectorAll('.column-content').forEach(col => col.innerHTML = '');

      orders.forEach(order => {
        const div = document.createElement('div');
        div.className = 'card';
        div.draggable = true;
        div.id = `order-${order.id}`;
        div.ondragstart = (e) => e.dataTransfer.setData('id', order.id);
        
        let trackingHtml = order.tracking_id ? `<span class="tag tag-ncm">ID: ${order.tracking_id}</span>` : '';
        let vrefHtml = order.vref_id ? `<span class="tag tag-vref">VREF: ${order.vref_id}</span>` : '';
        let phoneText = order.phone2 ? `${order.phone_number} / ${order.phone2}` : order.phone_number;
        let instructionHtml = order.instruction ? `<div class="instruction-text">${order.instruction}</div>` : '';

        div.innerHTML = `
          <div class="card-top-row">
            <span class="customer-name">${order.customer_name}</span>
            <button class="btn-delete" onclick="deleteOrder(${order.id})">Del</button>
          </div>
          <div class="card-text">${phoneText}</div>
          <div class="card-text">${order.shipping_address}</div>
          <div class="card-text" style="font-weight: 500; color: var(--text-dark); margin-top: 8px;">
            ${order.package_name || 'N/A'} &bull; NPR ${order.cod_amount || 0}
          </div>
          ${instructionHtml}
          <div class="tags">
            <span class="tag tag-branch">${order.to_branch || 'KALANKI'} (${order.delivery_type || 'Door'})</span>
            ${trackingHtml}
            ${vrefHtml}
          </div>
        `;
        
        const column = document.getElementById(order.status);
        if (column) column.appendChild(div);
      });
    }

    document.getElementById('orderForm').onsubmit = async (e) => {
      e.preventDefault();
      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.innerText = 'Submitting...'; submitBtn.disabled = true;

      await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          customer_name: document.getElementById('name').value,
          phone_number: document.getElementById('phone').value,
          phone2: document.getElementById('phone2').value,
          shipping_address: document.getElementById('address').value,
          package_name: document.getElementById('packageName').value,
          cod_amount: document.getElementById('codAmount').value,
          to_branch: document.getElementById('toBranch').value,
          delivery_type: document.getElementById('deliveryType').value,
          instruction: document.getElementById('instruction').value
        })
      });
      
      submitBtn.innerText = 'Submit Order'; submitBtn.disabled = false;
      closeModal();
      loadOrders();
    };

    function allowDrop(e) { e.preventDefault(); }

    async function drop(e, newStatus) {
      e.preventDefault();
      const orderId = e.dataTransfer.getData('id');
      
      const res = await fetch(`/api/orders/${orderId}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus })
      });

      const data = await res.json();
      if (!res.ok) alert(`API Error: ${JSON.stringify(data.details || data.error)}`);
      loadOrders(); 
    }

    async function syncNCM() {
      const btn = document.querySelector('.btn-secondary');
      btn.innerText = 'Syncing...';
      try {
        const res = await fetch('/api/orders/sync', { method: 'POST' });
        const data = await res.json();
        if(data.success) {
          alert(`Sync complete. ${data.synced} orders updated.`);
          loadOrders();
        }
      } catch (err) { alert('Sync failed.'); }
      btn.innerText = 'Sync NCM';
    }

    async function deleteOrder(id) {
      if (!confirm('Permanently delete this order?')) return;
      try {
        const res = await fetch(`/api/orders/${id}`, { method: 'DELETE' });
        if (res.ok) loadOrders();
      } catch (err) { alert('Error deleting order.'); }
    }

    loadBranches();
    loadOrders();
  </script>
</body>
</html>
