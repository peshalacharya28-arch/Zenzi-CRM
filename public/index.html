<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenzi Shop — Admin Access</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #0f172a;
    }
    .login-card {
      background: #ffffff;
      padding: 40px 36px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
      text-align: center;
    }
    .icon-wrapper {
      width: 52px;
      height: 52px;
      background: #e0f2fe;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .icon-wrapper svg {
      width: 22px;
      height: 22px;
      stroke: #0284c7;
      stroke-width: 2;
      fill: none;
    }
    h2 {
      margin: 0 0 6px 0;
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.4px;
    }
    .subtitle {
      margin: 0 0 28px 0;
      font-size: 14px;
      color: #64748b;
    }
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #334155;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      background: #ffffff;
      color: #0f172a;
      outline: none;
      transition: all 0.2s ease;
    }
    input::placeholder {
      color: #94a3b8;
    }
    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }
    button {
      width: 100%;
      background: #0f172a;
      color: #ffffff;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #1e293b;
    }
    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    button svg {
      width: 16px;
      height: 16px;
      stroke: #ffffff;
      stroke-width: 2.5;
      fill: none;
    }
    .msg {
      margin-top: 16px;
      font-size: 13px;
      text-align: center;
      word-break: break-word;
    }
    .error {
      color: #ef4444;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>

    <h2>Admin Access</h2>
    <p class="subtitle">Sign in to manage your operations.</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Username / Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" id="btn-login">
        <span>Sign In</span>
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>

    <div id="status-msg" class="msg"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://pnecdxsqaevyvsnibdcu.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBuZWNkeHNxYWV2eXZzbmliZGN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNTM5ODYsImV4cCI6MjEwNDYyOTk4Nn0.Tv4JKePkfyAFUYsDnPSRNnRIt_mcs_lmNFh67VHaEBI";

    const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Auto-redirect if already authenticated
    dbClient.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = '/dashboard.html';
    });

    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const msg = document.getElementById('status-msg');
      const btn = document.getElementById('btn-login');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      msg.innerText = "";
      btn.querySelector('span').innerText = "Authenticating...";
      btn.disabled = true;

      const { data, error } = await dbClient.auth.signInWithPassword({ email, password });

      if (error) {
        msg.innerText = error.message;
        msg.className = "msg error";
        btn.querySelector('span').innerText = "Sign In";
        btn.disabled = false;
      } else {
        window.location.href = '/dashboard.html';
      }
    };
  </script>
</body>
</html>
