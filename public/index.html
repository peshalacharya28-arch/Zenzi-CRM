<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenzi Shop — Login Gateway</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f6f4f0;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #2d251e;
    }
    .login-card {
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      border: 1px solid #e8e4dc;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 12px rgba(45, 37, 30, 0.05);
    }
    h2 { margin: 0 0 8px 0; font-size: 20px; font-weight: 600; color: #1c1714; }
    p { margin: 0 0 24px 0; font-size: 13px; color: #6b5c50; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d8d2c7;
      border-radius: 8px;
      font-size: 14px;
      background: #faf8f5;
      margin-bottom: 12px;
      outline: none;
    }
    input:focus { border-color: #7a5230; background: #ffffff; }
    button {
      width: 100%;
      background: #2d251e;
      color: #ffffff;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #4a3c31; }
    .hidden { display: none; }
    .msg { margin-top: 12px; font-size: 12px; text-align: center; }
    .error { color: #dc2626; }
    .info { color: #16a34a; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Zenzi Operations</h2>
    <p>Sign in with your authorized email to access the CRM.</p>

    <!-- STEP 1: Request OTP -->
    <div id="step-email">
      <input type="email" id="email" placeholder="name@zenzishop.com" required>
      <button onclick="sendOTP()" id="btn-send">Send Verification Code</button>
    </div>

    <!-- STEP 2: Verify OTP -->
    <div id="step-otp" class="hidden">
      <input type="text" id="otp" placeholder="Enter 8-digit OTP" required maxlength="8">
      <button onclick="verifyOTP()" id="btn-verify">Verify & Enter CRM</button>
    </div>

    <div id="status-msg" class="msg"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://pnecdxsqaevyvsnibdcu.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBuZWNkeHNxYWV2eXZzbmliZGN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNTM5ODYsImV4cCI6MjEwNDYyOTk4Nn0.Tv4JKePkfyAFUYsDnPSRNnRIt_mcs_lmNFh67VHaEBI";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Auto-redirect if already logged in
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = '/dashboard.html';
    });

    let userEmail = "";

    async function sendOTP() {
      userEmail = document.getElementById('email').value.trim();
      const msg = document.getElementById('status-msg');
      if (!userEmail) { msg.innerText = "Please enter your email"; msg.className = "msg error"; return; }

      document.getElementById('btn-send').innerText = "Sending...";
      const { error } = await supabase.auth.signInWithOtp({ email: userEmail });

      if (error) {
        msg.innerText = error.message;
        msg.className = "msg error";
        document.getElementById('btn-send').innerText = "Send Verification Code";
      } else {
        msg.innerText = "OTP sent to your email! Check your inbox.";
        msg.className = "msg info";
        document.getElementById('step-email').classList.add('hidden');
        document.getElementById('step-otp').classList.remove('hidden');
      }
    }

    async function verifyOTP() {
      const token = document.getElementById('otp').value.trim();
      const msg = document.getElementById('status-msg');

      document.getElementById('btn-verify').innerText = "Verifying...";
      const { data, error } = await supabase.auth.verifyOtp({
        email: userEmail,
        token: token,
        type: 'email'
      });

      if (error) {
        msg.innerText = error.message;
        msg.className = "msg error";
        document.getElementById('btn-verify').innerText = "Verify & Enter CRM";
      } else {
        window.location.href = '/dashboard.html';
      }
    }
  </script>
</body>
</html>
