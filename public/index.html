<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenzi Shop — Login Gateway</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f6f4f0;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #2d251e;
    }
    .login-card {
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      border: 1px solid #e8e4dc;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 12px rgba(45, 37, 30, 0.05);
    }
    h2 { margin: 0 0 8px 0; font-size: 20px; font-weight: 600; color: #1c1714; }
    p { margin: 0 0 24px 0; font-size: 13px; color: #6b5c50; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d8d2c7;
      border-radius: 8px;
      font-size: 14px;
      background: #faf8f5;
      margin-bottom: 12px;
      outline: none;
    }
    input:focus { border-color: #7a5230; background: #ffffff; }
    button {
      width: 100%;
      background: #2d251e;
      color: #ffffff;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #4a3c31; }
    button:disabled { background: #8c827a; cursor: not-allowed; }
    .msg { margin-top: 12px; font-size: 12px; text-align: center; word-break: break-word; }
    .error { color: #dc2626; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Zenzi Operations</h2>
    <p>Sign in with your email and password to access the CRM.</p>

    <form id="loginForm">
      <input type="email" id="email" placeholder="Email address" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit" id="btn-login">Sign In</button>
    </form>

    <div id="status-msg" class="msg"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://pnecdxsqaevyvsnibdcu.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBuZWNkeHNxYWV2eXZzbmliZGN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNTM5ODYsImV4cCI6MjEwNDYyOTk4Nn0.Tv4JKePkfyAFUYsDnPSRNnRIt_mcs_lmNFh67VHaEBI";

    const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Auto-redirect if already authenticated
    dbClient.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = '/dashboard.html';
    });

    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const msg = document.getElementById('status-msg');
      const btn = document.getElementById('btn-login');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      msg.innerText = "";
      btn.innerText = "Authenticating...";
      btn.disabled = true;

      const { data, error } = await dbClient.auth.signInWithPassword({ email, password });

      if (error) {
        msg.innerText = error.message;
        msg.className = "msg error";
        btn.innerText = "Sign In";
        btn.disabled = false;
      } else {
        window.location.href = '/dashboard.html';
      }
    };
  </script>
</body>
</html>
